<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PelliScope Kiosk EHS Demo</title>
  <meta name="robots" content="noindex, nofollow, noarchive">
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div class="header">
        <p class="eyebrow">PelliScope Watch Link</p>
        <div class="title-row">
          <div>
            <h1>PelliScope Kiosk / EHS Demo</h1>
            <p class="subtitle">Browser playback page for the kiosk-oriented Emirates Health Services walkthrough.</p>
          </div>
          <div class="actions">
            <a class="button primary" href="/videos/pelliscope/pelliscope-kiosk-ehs-demo.mp4">Open Direct MP4</a>
            <a class="button" href="/videos/pelliscope/pelliscope-kiosk-ehs-demo.mp4" download>Download MP4</a>
          </div>
        </div>
      </div>
      <div class="video-wrap video-kiosk">
        <div class="video-shell">
          <video controls playsinline preload="metadata" autoplay muted>
            <source src="/videos/pelliscope/pelliscope-kiosk-ehs-demo.mp4" type="video/mp4">
            Your browser does not support the video tag.
          </video>
        </div>
      </div>
      <div class="meta">
        <div class="meta-card">
          <span class="meta-label">Format</span>
          <span class="meta-value">MP4 / H.264</span>
        </div>
        <div class="meta-card">
          <span class="meta-label">Resolution</span>
          <span class="meta-value">1920 x 1080</span>
        </div>
        <div class="meta-card">
          <span class="meta-label">Duration</span>
          <span class="meta-value">1m 44s</span>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
